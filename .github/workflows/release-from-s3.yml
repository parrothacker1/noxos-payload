name: release-from-s3

on:
  workflow_dispatch:
    inputs:
      s3_prefix:
        description: "S3 prefix holding the build's artifacts (one or more ABIs), e.g. s3://noxos-releases/payload-build/20260915T170054Z/"
        required: true
      tag:
        description: "Release tag, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NOXOS_PAYLOAD_RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NOXOS_PAYLOAD_RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts from S3
        run: |
          mkdir -p release-assets
          aws s3 cp --recursive "${{ inputs.s3_prefix }}" release-assets/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            release-assets/* \
            --title "${{ inputs.tag }}" \
            --generate-notes
