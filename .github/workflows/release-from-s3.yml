name: release-from-s3

on:
  workflow_dispatch:
    inputs:
      s3_path:
        description: "Full s3:// path to the built .so, e.g. s3://noxos-releases/payload-build/20260915T170054Z/libnoxos_payload_stub.so"
        required: true
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true
      abi:
        description: "ABI suffix for the release asset name"
        required: false
        default: "x86_64"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.NOXOS_PAYLOAD_RELEASE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NOXOS_PAYLOAD_RELEASE_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact from S3
        run: aws s3 cp "${{ inputs.s3_path }}" "./libnoxos_payload_stub-${{ inputs.abi }}.so"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            "libnoxos_payload_stub-${{ inputs.abi }}.so" \
            --title "${{ inputs.tag }}" \
            --generate-notes
