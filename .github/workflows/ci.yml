name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build parser self-check
        run: clang++ -std=c++17 -g -fsanitize=address,undefined -o exif_test exif_parser.cpp test/exif_parser_test.cpp
      - name: Run parser self-check
        run: ./exif_test
      - name: Build file cheap filter self-check
        run: clang++ -std=c++17 -g -fsanitize=address,undefined -o file_cf_test file_cheap_filter.cpp test/file_cheap_filter_test.cpp
      - name: Run file cheap filter self-check
        run: ./file_cf_test
      - name: Build ZIP/APK scanner self-check
        run: clang++ -std=c++17 -g -fsanitize=address,undefined -o zip_scan_test zip_scan.cpp test/zip_scan_test.cpp -lz
      - name: Run ZIP/APK scanner self-check
        run: ./zip_scan_test
      - name: Build PDF scanner self-check
        run: clang++ -std=c++17 -g -fsanitize=address,undefined -o pdf_scan_test pdf_scan.cpp test/pdf_scan_test.cpp -lz
      - name: Run PDF scanner self-check
        run: ./pdf_scan_test
      - name: Build file scan pipeline self-check
        run: clang++ -std=c++17 -g -fsanitize=address,undefined -o file_scan_test file_scan.cpp file_type.cpp zip_scan.cpp pdf_scan.cpp exif_parser.cpp file_cheap_filter.cpp test/file_scan_test.cpp -lz
      - name: Run file scan pipeline self-check
        run: ./file_scan_test

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzzer
        run: clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -o exif_fuzzer exif_parser.cpp fuzz/exif_fuzzer.cpp
      - name: Run bounded fuzz pass
        run: mkdir -p corpus && cp fuzz/seeds/* corpus/ && ./exif_fuzzer corpus -max_total_time=60 -print_final_stats=1
      - name: Build file cheap filter fuzzer
        run: clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -o file_cf_fuzzer file_cheap_filter.cpp fuzz/file_cheap_filter_fuzzer.cpp
      - name: Run bounded file cheap filter fuzz pass
        run: mkdir -p corpus_file_cf && ./file_cf_fuzzer corpus_file_cf -max_total_time=60 -print_final_stats=1
      - name: Build ZIP/APK scanner fuzzer
        run: clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -o zip_fuzzer zip_scan.cpp fuzz/zip_scan_fuzzer.cpp -lz
      - name: Run bounded ZIP/APK scanner fuzz pass
        run: mkdir -p corpus_zip && cp fuzz/seeds_zip/* corpus_zip/ && ./zip_fuzzer corpus_zip -max_total_time=60 -print_final_stats=1
      - name: Build PDF scanner fuzzer
        run: clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -o pdf_fuzzer pdf_scan.cpp fuzz/pdf_scan_fuzzer.cpp -lz
      - name: Run bounded PDF scanner fuzz pass
        run: mkdir -p corpus_pdf && cp fuzz/seeds_pdf/* corpus_pdf/ && ./pdf_fuzzer corpus_pdf -max_total_time=60 -max_len=65536 -print_final_stats=1
      - name: Build file scan pipeline fuzzer
        run: clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all -o file_scan_fuzzer file_scan.cpp file_type.cpp zip_scan.cpp pdf_scan.cpp exif_parser.cpp file_cheap_filter.cpp fuzz/file_scan_fuzzer.cpp -lz
      - name: Run bounded file scan pipeline fuzz pass
        run: mkdir -p corpus_fs && cp fuzz/seeds/* fuzz/seeds_pdf/* fuzz/seeds_zip/* corpus_fs/ && ./file_scan_fuzzer corpus_fs -max_total_time=60 -max_len=65536 -print_final_stats=1
